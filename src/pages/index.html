<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <script type="module" crossorigin src="/vite-vanilla-login-practice/assets/pages/index-DPZQviV-.js"></script>
    <link rel="modulepreload" crossorigin href="/vite-vanilla-login-practice/assets/Auth-DtfDogGL.js">
    <link rel="stylesheet" crossorigin href="/vite-vanilla-login-practice/assets/Auth-B8881qih.css">
  </head>

  <body class="login-layout">
    <div class="loading">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div class="login-card" id="auth-container">
      <!-- Login Form Section -->
      <div id="login-section">
        <div class="text-center mb-4">
          <h2 class="fw-bold text-dark">Welcome Back</h2>
          <p class="text-muted">Please sign in to your account</p>
        </div>

        <form id="login-form">
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <div class="input-group">
              <span class="input-group-text"
                ><i class="bi bi-envelope"></i
              ></span>
              <input
                type="email"
                class="form-control"
                id="email"
                placeholder="name@example.com"
                required
              />
            </div>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input
                type="password"
                class="form-control"
                id="password"
                placeholder="Enter your password"
                required
              />
            </div>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember" />
              <label class="form-check-label" for="remember">
                Remember me
              </label>
            </div>
            <a href="#" class="text-decoration-none" style="color: #764ba2"
              >Forgot password?</a
            >
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
            Sign In
          </button>
        </form>

        <div class="divider">Or sign in with</div>

        <div class="d-grid gap-2">
          <button id="google-login" class="btn btn-outline-danger social-btn">
            <i class="bi bi-google me-2"></i> Continue with Google
          </button>
          <button id="github-login" class="btn btn-outline-dark social-btn">
            <i class="bi bi-github me-2"></i> Continue with GitHub
          </button>
        </div>

        <div class="text-center mt-4">
          <span class="text-muted">Don't have an account?</span>
          <a
            href="#"
            id="show-register"
            class="text-decoration-none fw-bold"
            style="color: #764ba2"
            >Sign up</a
          >
        </div>
      </div>

      <!-- Registration Form Section (Hidden by default) -->
      <div id="register-section" class="d-none">
        <div class="text-center mb-4">
          <h2 class="fw-bold text-dark">Create Account</h2>
          <p class="text-muted">Join our community today</p>
        </div>

        <form id="register-form">
          <div class="mb-3">
            <label for="reg-name" class="form-label">Full Name</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input
                type="text"
                class="form-control"
                id="reg-name"
                placeholder="John Doe"
                required
              />
            </div>
          </div>
          <div class="mb-3">
            <label for="reg-email" class="form-label">Email address</label>
            <div class="input-group">
              <span class="input-group-text"
                ><i class="bi bi-envelope"></i
              ></span>
              <input
                type="email"
                class="form-control"
                id="reg-email"
                placeholder="name@example.com"
                required
              />
            </div>
          </div>
          <div class="mb-3">
            <label for="reg-password" class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input
                type="password"
                class="form-control"
                id="reg-password"
                placeholder="Create a password"
                required
              />
            </div>
          </div>
          <div class="mb-3">
            <label for="reg-confirm-password" class="form-label"
              >Confirm Password</label
            >
            <div class="input-group">
              <span class="input-group-text"
                ><i class="bi bi-lock-fill"></i
              ></span>
              <input
                type="password"
                class="form-control"
                id="reg-confirm-password"
                placeholder="Confirm your password"
                required
              />
            </div>
          </div>

          <div class="form-check mb-4">
            <input
              class="form-check-input"
              type="checkbox"
              id="terms"
              required
            />
            <label class="form-check-label" for="terms">
              I agree to the
              <a href="#" style="color: #764ba2">Terms & Conditions</a>
            </label>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
            Sign Up
          </button>
        </form>

        <div class="text-center mt-4">
          <span class="text-muted">Already have an account?</span>
          <a
            href="#"
            id="show-login"
            class="text-decoration-none fw-bold"
            style="color: #764ba2"
            >Sign in</a
          >
        </div>
      </div>
    </div>
  </body>
</html>
